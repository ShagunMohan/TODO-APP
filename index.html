<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Daylist — a little room to think</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5f0;
      --ink: #242820;
      --muted: #777c70;
      --line: #e3e5dc;
      --white: #fff;
      --green: #315d45;
      --green-pale: #e8eee8;
      --gold: #d7a64a;
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d9ddd2 0.65px, transparent 0.65px);
      background-size: 18px 18px;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(100% - 40px, 680px);
      margin: 0 auto;
      padding: 58px 0 48px;
      animation: arrive 500ms ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      color: white;
      background: var(--green);
      font-size: 16px;
    }

    .date {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .intro { margin-bottom: 30px; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(36px, 8vw, 48px);
      font-weight: 500;
      line-height: 1.1;
    }

    .subtitle {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 8px 24px rgb(36 40 32 / 4%);
    }

    .composer input {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
    }

    .composer input::placeholder { color: #989c92; }

    .composer:focus-within {
      border-color: #91a895;
      box-shadow: 0 0 0 3px rgb(49 93 69 / 10%);
    }

    .add-button {
      flex: 0 0 auto;
      padding: 0 17px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: var(--green);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: #254a36; }
    .add-button:active { transform: scale(.97); }

    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 31px 0 12px;
    }

    .list-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .count {
      display: grid;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      place-items: center;
      border-radius: 99px;
      color: var(--green);
      background: var(--green-pale);
      font-size: 11px;
    }

    .filters {
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgb(255 255 255 / 65%);
    }

    .filter {
      padding: 6px 10px;
      border: 0;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }

    .filter[aria-pressed="true"] {
      color: var(--ink);
      background: white;
      box-shadow: 0 1px 3px rgb(36 40 32 / 10%);
    }

    .task-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    .task-row {
      display: flex;
      min-height: 57px;
      align-items: center;
      gap: 13px;
      padding: 10px 15px;
      border-bottom: 1px solid #eff0eb;
      animation: arrive 220ms ease-out both;
    }

    .task-row:last-child { border-bottom: 0; }

    .task-check {
      position: relative;
      display: grid;
      flex: 0 0 19px;
      width: 19px;
      height: 19px;
      margin: 0;
      place-items: center;
      appearance: none;
      border: 1.5px solid #c6cbc0;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }

    .task-check:checked {
      border-color: var(--green);
      background: var(--green);
    }

    .task-check:checked::after {
      width: 8px;
      height: 4px;
      border-bottom: 1.5px solid white;
      border-left: 1.5px solid white;
      content: "";
      transform: translateY(-1px) rotate(-45deg);
    }

    .task-check:focus-visible, button:focus-visible {
      outline: 3px solid rgb(49 93 69 / 28%);
      outline-offset: 2px;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.45;
    }

    .task-row.done .task-text {
      color: #92978d;
      text-decoration: line-through;
      text-decoration-color: #b8bdb3;
    }

    .delete-button {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 5px;
      color: #92978d;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .delete-button:hover {
      color: #a34538;
      background: #f8eeeb;
    }

    .empty-state {
      padding: 37px 20px 39px;
      text-align: center;
    }

    .empty-mark {
      display: grid;
      width: 38px;
      height: 38px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 50%;
      color: #956e29;
      background: #f5efdf;
      font-size: 18px;
    }

    .empty-state p { margin: 0; }
    .empty-title { font-size: 13px; font-weight: 600; }
    .empty-note { margin-top: 5px !important; color: var(--muted); font-size: 12px; }

    .list-foot {
      display: flex;
      min-height: 45px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .clear-button {
      padding: 6px 0 6px 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }

    .clear-button:hover { color: #a34538; }
    .clear-button:disabled { visibility: hidden; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .page { width: min(100% - 32px, 680px); padding-top: 31px; }
      .topline { margin-bottom: 39px; }
      .list-head { align-items: flex-start; flex-direction: column; }
      .filters { align-self: stretch; }
      .filter { flex: 1; }
      .add-button { padding: 0 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">d</span> daylist</div>
      <time class="date" id="today"></time>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">A little room to think</p>
      <h1 id="page-title">Make today count.</h1>
      <p class="subtitle">One thing at a time is a good pace.</p>
    </section>

    <form class="composer" id="task-form">
      <input id="task-input" name="task" type="text" maxlength="180" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
      <button class="add-button" type="submit">Add task</button>
    </form>

    <section aria-labelledby="list-title">
      <div class="list-head">
        <h2 class="list-title" id="list-title">Your list <span class="count" id="task-count">0</span></h2>
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </nav>
      </div>
      <div class="task-list" id="task-list" aria-live="polite"></div>
      <footer class="list-foot">
        <span id="list-summary">A fresh start.</span>
        <button class="clear-button" id="clear-completed" type="button" disabled>Clear completed</button>
      </footer>
    </section>
  </main>

  <script>
    const storageKey = "daylist-tasks-v1";
    const taskList = document.querySelector("#task-list");
    const taskInput = document.querySelector("#task-input");
    const taskCount = document.querySelector("#task-count");
    const summary = document.querySelector("#list-summary");
    const clearCompleted = document.querySelector("#clear-completed");
    let activeFilter = "all";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved) ? saved.filter(task =>
          task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean"
        ) : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
      } catch {
        summary.textContent = "Changes will stay until you close this tab.";
      }
    }

    function render() {
      const visibleTasks = tasks.filter(task => {
        if (activeFilter === "active") return !task.completed;
        if (activeFilter === "completed") return task.completed;
        return true;
      });
      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent = String(remaining);
      taskList.replaceChildren();

      if (visibleTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        const mark = document.createElement("span");
        mark.className = "empty-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = activeFilter === "completed" ? "✓" : "✳";
        const title = document.createElement("p");
        title.className = "empty-title";
        title.textContent = activeFilter === "completed" ? "Nothing checked off yet" : activeFilter === "active" ? "All caught up" : "Your mind, uncluttered";
        const note = document.createElement("p");
        note.className = "empty-note";
        note.textContent = activeFilter === "completed" ? "Finished tasks will find their way here." : activeFilter === "active" ? "Enjoy the breathing room." : "Add a task above to get started.";
        empty.append(mark, title, note);
        taskList.append(empty);
      } else {
        for (const task of visibleTasks) {
          const row = document.createElement("div");
          row.className = `task-row${task.completed ? " done" : ""}`;
          const checkbox = document.createElement("input");
          checkbox.className = "task-check";
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.setAttribute("aria-label", `${task.completed ? "Mark as to do" : "Complete"}: ${task.text}`);
          checkbox.addEventListener("change", () => updateTask(task.id, { completed: checkbox.checked }));
          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;
          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.textContent = "×";
          remove.setAttribute("aria-label", `Delete: ${task.text}`);
          remove.title = "Delete task";
          remove.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);
            saveTasks();
            render();
          });
          row.append(checkbox, text, remove);
          taskList.append(row);
        }
      }

      summary.textContent = tasks.length === 0
        ? "A fresh start."
        : remaining === 0
          ? "Everything is wrapped up."
          : `${remaining} ${remaining === 1 ? "thing" : "things"} left to do`;
      clearCompleted.disabled = !tasks.some(task => task.completed);
    }

    function updateTask(id, changes) {
      tasks = tasks.map(task => task.id === id ? { ...task, ...changes } : task);
      saveTasks();
      render();
    }

    document.querySelector("#task-form").addEventListener("submit", event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }
      tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
      taskInput.value = "";
      activeFilter = "all";
      document.querySelectorAll(".filter").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter));
      });
      saveTasks();
      render();
      taskInput.focus();
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".filter").forEach(filterButton => {
          filterButton.setAttribute("aria-pressed", String(filterButton === button));
        });
        render();
      });
    });

    clearCompleted.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    const today = new Date();
    document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long", month: "long", day: "numeric"
    }).format(today);
    document.querySelector("#today").dateTime = today.toISOString().slice(0, 10);
    render();
  </script>
</body>
</html>
